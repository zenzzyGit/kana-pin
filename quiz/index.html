<style>
/* Schulheft: Karopapier, rote Randlinie, Tinte, Füller-Blau, Rotstift, Textmarker */
:root {
  --paper: #FBFCFD; --card: #FFFFFF; --grid: rgba(64, 104, 168, .12); --margin: rgba(210, 58, 47, .55);
  --ink: #1D2230; --muted: #5A6070; --rule: #C3CCDD; --blue: #1F3FA6; --on-blue: #FFFFFF;
  --red: #D23A2F; --green: #2E8B57; --marker: #FFF0A0; --on-marker: #1D2230; --shadow: #1D2230;
  --hand: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14171E; --card: #1C202A; --grid: rgba(140, 165, 215, .10); --margin: rgba(255, 107, 94, .45);
    --ink: #E9ECF3; --muted: #9AA3B5; --rule: #343B4A; --blue: #8AA4FF; --on-blue: #0E1220;
    --red: #FF6B5E; --green: #4CC38A; --marker: #3D3820; --on-marker: #F4E7A8; --shadow: #05060A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14171E; --card: #1C202A; --grid: rgba(140, 165, 215, .10); --margin: rgba(255, 107, 94, .45);
  --ink: #E9ECF3; --muted: #9AA3B5; --rule: #343B4A; --blue: #8AA4FF; --on-blue: #0E1220;
  --red: #FF6B5E; --green: #4CC38A; --marker: #3D3820; --on-marker: #F4E7A8; --shadow: #05060A;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--body); -webkit-text-size-adjust: 100%; line-height: 1.4;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px;
}
body::before {
  content: ""; position: fixed; top: 0; bottom: 0; left: max(22px, env(safe-area-inset-left)); width: 2px;
  background: var(--margin); pointer-events: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
.app {
  min-height: 100vh; min-height: 100dvh; max-width: 540px; margin: 0 auto; display: flex; flex-direction: column;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) calc(max(22px, env(safe-area-inset-left)) + 18px);
}
.top { display: flex; align-items: center; gap: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
.brand { font-family: var(--hand); font-weight: 600; color: var(--red); font-size: 19px; margin-right: auto; white-space: nowrap; flex: none; }
.progress { color: var(--blue); font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 4px; min-width: 0; flex: 0 1 auto; }
.icon-btn { background: none; border: 0; color: var(--muted); font-size: 19px; padding: 6px 8px; border-radius: 10px; }
.icon-btn:active { background: var(--rule); }
.spacer { flex: 1; min-height: 8px; }
.center { text-align: center; }
.notice {
  margin-top: 10px; padding: 10px 14px 10px 18px; font-weight: 700; color: var(--on-marker);
  background: var(--marker); border-left: 5px solid var(--ink); border-radius: 4px; white-space: pre-line;
}
.badge {
  display: inline-block; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 11px;
  letter-spacing: .1em; padding: 2px 9px; visibility: hidden;
}
.badge.on { visibility: visible; }
.prompt { color: var(--muted); font-size: 16px; margin-top: 10px; }
.big { font-family: var(--hand); font-weight: 600; font-size: 150px; line-height: 1.12; margin: 0; overflow-wrap: anywhere; }
.big.latin { font-family: var(--body); font-weight: 700; }
.big.tap { cursor: pointer; }
.script { color: var(--muted); font-size: 12px; letter-spacing: .2em; }
.hint-btn { margin-top: 12px; background: var(--paper); color: var(--blue); border: 1.5px solid var(--blue); border-radius: 20px; padding: 8px 18px; font-size: 14px; }
.hint-btn.hidden { visibility: hidden; }
.hint, .ex-mn {
  background: var(--marker); color: var(--on-marker); border-left: 5px solid var(--ink); border-radius: 4px;
  padding: 11px 14px 11px 16px; font-size: 15px; line-height: 1.55; white-space: pre-line;
}
.hint { margin: 10px 2px 0; }
.feedback { min-height: 30px; margin-top: 10px; font-weight: 700; font-size: 17px; color: var(--green); text-align: center; }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 4px; }
.opt, .card-btn {
  background: var(--card); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 12px;
  box-shadow: 3px 3px 0 var(--shadow); transition: transform .1s ease, box-shadow .1s ease, background-color .2s ease;
}
.opt { min-height: 78px; font-size: 26px; padding: 6px; white-space: pre-line; line-height: 1.2; }
.opt.kana { font-family: var(--hand); font-weight: 600; }
.opt:active, .card-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
.opt.good { background: var(--green); color: #fff; }
.typerow { display: flex; gap: 12px; padding: 0 4px; }
.typerow input {
  flex: 1; min-width: 0; height: 64px; border: 1.5px solid var(--ink); border-radius: 12px; background: var(--card); color: var(--ink);
  font-size: 26px; text-align: center; outline: none; font-family: var(--body);
}
.typerow input:focus { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue); }
.btn-primary {
  background: var(--blue); color: var(--on-blue); border: 1.5px solid var(--ink); border-radius: 12px; font-weight: 700; font-size: 17px;
  padding: 0 22px; min-height: 54px; box-shadow: 3px 3px 0 var(--shadow);
}
.btn-primary:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
.typerow .btn-primary { min-height: 64px; }
.link-btn { background: none; border: 0; color: var(--muted); font-size: 14px; padding: 12px; width: 100%; }
.explain {
  background: var(--card); border: 1.5px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--shadow);
  padding: 16px 18px 18px; margin: 0 4px;
}
.explain-head { display: flex; gap: 10px; align-items: center; }
.explain-head > div { flex: 1; min-width: 0; }
.ex-title { color: var(--red); font-family: var(--hand); font-weight: 600; font-size: 18px; }
.ex-main { font-family: var(--hand); font-weight: 600; font-size: 40px; line-height: 1.2; overflow-wrap: anywhere; }
.ex-main.long { font-size: 28px; }
.ex-chosen { color: var(--muted); font-size: 16px; }
.ex-tip { margin-top: 12px; font-size: 15px; line-height: 1.55; white-space: pre-line; }
.ex-mn { margin-top: 10px; }
.ex-actions { display: flex; gap: 10px; margin-top: 16px; }
.ex-actions .btn-primary { flex: 1; }
.speak { width: 64px; min-height: 54px; font-size: 22px; }
svg.strokes { width: 92px; height: 92px; flex: none; background: var(--paper); border: 2px solid var(--red); border-radius: 12px; }
svg.strokes .guide { stroke: var(--red); opacity: .45; stroke-width: .6; stroke-dasharray: 3 3; fill: none; }
svg.strokes .s { fill: none; stroke: var(--ink); stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round; }
svg.strokes .ghost { fill: none; stroke: var(--ink); opacity: .14; stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round; }
svg.strokes circle { fill: var(--red); }
svg.strokes text { fill: #fff; font-size: 9px; font-weight: 700; text-anchor: middle; font-family: system-ui, sans-serif; }
.foot { display: flex; gap: 10px; margin: 16px 4px 0; }
.foot button { flex: 1; min-height: 50px; border-radius: 12px; border: 0; background: none; color: var(--muted); font-size: 15px; }
[hidden] { display: none !important; }
.explaining .prompt, .explaining .script, .explaining .badge, .explaining .feedback { display: none; }
.explaining .big { font-size: 64px !important; }
.explaining .spacer { flex: 0 0 8px; }

/* Ende einer Runde */
.done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
.stamp {
  display: inline-block; color: var(--red); border: 3px solid var(--red); border-radius: 14px; background: var(--paper);
  font-family: var(--hand); font-weight: 600; font-size: 30px; padding: 12px 24px; transform: rotate(-12deg);
  animation: stamp .32s cubic-bezier(.2, 1.4, .5, 1) both;
}
@keyframes stamp { from { transform: rotate(-12deg) scale(2.4); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: 1; } }
.done h2 { margin: 18px 0 0; font-size: 22px; }
.done p { margin: 0; color: var(--muted); line-height: 1.55; white-space: pre-line; }
.done .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.card-btn { min-height: 54px; padding: 0 20px; font-size: 16px; }
.tiny { font-size: 13px; color: var(--muted); max-width: 30em; line-height: 1.5; }
.goalbar { width: min(280px, 80%); height: 10px; border-radius: 6px; background: var(--rule); overflow: hidden; }
.goalbar i { display: block; height: 100%; background: var(--green); transition: width .4s ease; }

/* Dialoge */
dialog { width: min(540px, 100vw); max-width: 100vw; height: 100%; max-height: 100%; margin: 0 auto; border: 0; padding: 0; background: transparent; color: var(--ink); }
dialog::backdrop { background: rgba(0, 0, 0, .5); }
.sheet {
  min-height: 100%; display: flex; flex-direction: column; gap: 4px;
  padding: max(14px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom)) 40px;
  background-color: var(--paper);
  background-image: linear-gradient(90deg, transparent 21px, var(--margin) 21px, var(--margin) 23px, transparent 23px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100% 100%, 20px 20px, 20px 20px;
}
.sheet h2 { margin: 0; font-family: var(--hand); font-weight: 600; font-size: 30px; flex: 1; }
.sheet-head { display: flex; align-items: center; }
.sec { display: flex; gap: 10px; align-items: baseline; margin-top: 22px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.sec b { font-family: var(--hand); color: var(--red); font-size: 18px; }
.sec span { font-weight: 700; font-size: 18px; }
label.chk { display: flex; align-items: center; gap: 12px; font-size: 16px; padding: 8px 0; }
label.chk input { width: 22px; height: 22px; accent-color: var(--blue); }
.field { display: flex; align-items: center; gap: 12px; padding: 8px 0; font-size: 16px; }
.field span { flex: 1; }
select, .text-in { background: var(--card); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 10px; padding: 9px 12px; font-size: 16px; font-family: var(--body); }
.text-in { width: 100%; }
.seg { display: flex; gap: 6px; margin-top: 6px; }
.seg button { flex: 1; min-height: 42px; border-radius: 8px; border: 1px solid var(--rule); background: none; color: var(--muted); }
.seg button.on { border: 1.5px solid var(--red); color: var(--red); font-weight: 700; background: color-mix(in srgb, var(--red) 12%, transparent); }
.me-card { background: var(--card); border: 2px solid var(--ink); border-radius: 4px; box-shadow: 4px 4px 0 var(--shadow); padding: 12px 16px 14px; margin-top: 12px; }
.me { font-size: 15px; line-height: 1.55; cursor: pointer; white-space: pre-line; }
.grp { color: var(--blue); font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 6px; }
.winner { margin-top: 12px; padding: 10px 14px 10px 18px; background: var(--marker); color: var(--on-marker); border-left: 5px solid var(--ink); border-radius: 4px; font-weight: 700; }
.rows { display: grid; gap: 6px; margin-top: 10px; }
.rowx {
  display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-radius: 6px; background: var(--card); border: 1px solid var(--rule);
  animation: rowin .22s ease both;
}
.rowx.me { background: var(--marker); color: var(--on-marker); border-color: transparent; border-left: 5px solid var(--ink); font-weight: 700; }
.rowx .rk { width: 40px; text-align: center; font-family: var(--hand); color: var(--muted); font-size: 17px; }
.rowx .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rowx .val { font-family: var(--hand); font-weight: 600; color: var(--blue); }
.rowx.me .val { color: inherit; }
@keyframes rowin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.status { color: var(--muted); text-align: center; padding: 16px 0; }
.code { font: 700 34px/1.3 ui-monospace, Menlo, monospace; letter-spacing: .1em; text-align: center; margin: 12px 0 4px; }
.bars { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; align-items: end; height: 110px; margin-top: 10px; border-bottom: 1.5px solid var(--ink); position: relative; }
.bars i { display: block; background: var(--blue); border-radius: 3px 3px 0 0; min-height: 0; }
.bars i.goal { background: var(--green); }
.bars .gl { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--red); }
.days { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; font-size: 10px; color: var(--muted); text-align: center; margin-top: 3px; }
.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 6px; margin-top: 12px; }
.bdg { text-align: center; font-size: 11px; color: var(--muted); cursor: pointer; }
.bdg i {
  display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 4px; border-radius: 50%;
  border: 1.5px dashed var(--muted); font-style: normal; font-family: var(--hand); font-size: 20px; opacity: .7;
}
.bdg.on { color: var(--ink); }
.bdg.on i { border: 2.5px solid var(--red); color: var(--red); transform: rotate(-10deg); opacity: 1; background: color-mix(in srgb, var(--red) 12%, transparent); }
.toast {
  position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 10; max-width: 90vw;
}

/* Animationen */
.pop { animation: pop .24s ease-out both; }
@keyframes pop { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }
.rise { animation: rise .22s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.pulse { animation: pulse .27s ease-out; }
@keyframes pulse { 40% { transform: scale(1.1); } }
.shake { animation: shake .32s ease-out; }
@keyframes shake { 15% { transform: translateX(-10px); } 35% { transform: translateX(10px); } 55% { transform: translateX(-7px); } 75% { transform: translateX(7px); } 90% { transform: translateX(-3px); } }
.slide { animation: slide .26s ease-out both; }
@keyframes slide { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .pop, .rise, .pulse, .shake, .slide, .stamp, .rowx { animation: none !important; }
}
@media (max-height: 640px) { .big { font-size: 110px; } .opt { min-height: 64px; } }
/* ---------- ab Version 3.6 ---------- */
.preview { min-height: 30px; text-align: center; font-family: var(--hand); font-weight: 600; font-size: 22px; color: var(--blue); margin-top: 4px; }
.big.sentence { font-size: 34px !important; line-height: 1.5; padding: 0 6px; }
.opt.particle { font-family: var(--hand); font-weight: 600; font-size: 34px; }
.opt.small { font-size: 17px; }
.opt.bad { background: var(--red); color: #fff; }
.av {
  flex: none; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--ink); overflow: hidden;
  font-family: var(--hand); font-weight: 600; color: #fff; background: var(--blue); background-size: cover; background-position: center;
}
.av.dark-text { color: #1D2230; }
.rowx .av { width: 32px; height: 32px; font-size: 15px; }
.prow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--rule); }
.prow.me { background: var(--marker); color: var(--on-marker); border: 0; border-left: 5px solid var(--ink); }
.prow .av { width: 44px; height: 44px; font-size: 20px; }
.prow .who { flex: 1; min-width: 0; }
.prow .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .who small { display: block; color: var(--muted); font-size: 13px; white-space: pre-line; }
.prow .pts { font-family: var(--hand); font-weight: 600; color: var(--blue); white-space: nowrap; }
.prow button { min-height: 40px; padding: 0 14px; }
.plist { display: grid; gap: 8px; margin-top: 10px; }
.profile { display: flex; gap: 14px; align-items: center; }
.profile .av { width: 68px; height: 68px; font-size: 30px; }
.fcode { font: 700 26px/1.3 ui-monospace, Menlo, monospace; letter-spacing: .08em; color: var(--blue); user-select: all; }
.btnrow { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.btnrow > * { flex: 1; }
.swatches { display: flex; gap: 6px; margin-top: 6px; }
.swatches button { flex: 1; height: 30px; border-radius: 15px; border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent); }
.swatches button.on { border: 3px solid var(--ink); }
.challenge { background: var(--card); border: 1.5px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--shadow); padding: 12px 16px; margin-top: 12px; }
.challenge b { font-family: var(--hand); color: var(--red); font-size: 17px; }
.challenge .goalbar { width: 100%; margin: 8px 0 6px; }
.hard { line-height: 1.7; white-space: pre-line; font-size: 15px; }
.sos-note { display: none; }
/* 3.7: Vorschau, Kalender, Live-Duell */
.fc { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 118px; margin-top: 8px; border-bottom: 1.5px solid var(--ink); }
.fc div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 12px; font-weight: 700; }
.fc div i { display: block; width: 62%; background: var(--blue); opacity: .7; border-radius: 3px 3px 0 0; margin-top: 3px; }
.fc div.today { color: var(--red); }
.fc div.today i { background: var(--red); opacity: 1; }
.fc div.zero { color: var(--muted); }
.fcd { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 11px; color: var(--muted); text-align: center; margin-top: 3px; }
.fcd span:first-child { color: var(--red); font-weight: 700; }
.cal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); grid-auto-columns: 1fr; gap: 3px; margin-top: 10px; max-width: 420px; }
.cal i { display: block; aspect-ratio: 1; border-radius: 3px; border: 1px solid color-mix(in srgb, var(--muted) 35%, transparent); }
.cal i.on { border-color: transparent; background: var(--green); }
.cal i.today { outline: 1.5px solid var(--red); outline-offset: 0; }
.cal i.pad { visibility: hidden; }
.live { color: var(--red); font-weight: 700; font-size: 14px; text-align: right; margin-top: 6px; }
.countdown { font-family: var(--hand); color: var(--red); font-size: 120px; line-height: 1; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <span class="brand" id="brand">かな</span>
    <span class="progress" id="progress"></span>
    <button class="icon-btn" id="btn-stats" aria-label="Progress">📊</button>
    <button class="icon-btn" id="btn-friends" aria-label="Friends">👥</button>
    <button class="icon-btn" id="btn-board" aria-label="Leaderboard">🏆</button>
    <button class="icon-btn" id="btn-settings" aria-label="Settings">⚙︎</button>
  </div>
  <div class="live" id="live" hidden></div>
  <div class="notice" id="notice" hidden></div>

  <div id="quiz" style="display:flex;flex-direction:column;flex:1">
    <div class="spacer"></div>
    <div class="center"><span class="badge" id="badge"></span></div>
    <div class="prompt center" id="prompt"></div>
    <div class="center"><p class="big" id="big" lang="ja"></p></div>
    <div class="script center" id="script"></div>
    <div class="center"><button class="hint-btn" id="hint-btn"></button></div>
    <div class="hint" id="hint" hidden></div>
    <div class="feedback" id="feedback"></div>
    <div class="spacer"></div>

function dueForecast(n) {
  const out = new Array(n).fill(0), ends = [];
  for (let i = 1; i <= n; i++) { const t = new Date(); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() + i); ends.push(t.getTime()); }
  for (const it of pool()) {
    const s = S.items[it.kana]; if (!s || !s.s) continue;
    for (let i = 0; i < n; i++) if ((s.d || 0) < ends[i]) { out[i]++; break; }
  }
  return out;
}

}));
$("st-per").addEventListener("change", e => { settingsDirty = true; SET.per = Number(e.target.value); store.set("kp_settings", SET); });
$("st-goal").addEventListener("change", e => { SET.goal = Number(e.target.value); store.set("kp_settings", SET); });
$("st-theme").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; store.set("kp_theme_v", b.dataset.t); applyTheme(); });
$("st-lang").addEventListener("change", async e => { store.set("kp_lang", e.target.value); await loadLang(e.target.value); applyStatic(); openSettings(); if (phase !== "explain") render(false); });
$("st-delete").onclick = () => ask({
  title: ui("delete_account"), msg: ui("delete_account_msg"), noInput: true, ok: ui("delete"),
  onOk: async () => {
    if (!B.id) return;
    try { await rpc("kana_delete_me", auth()); if (PUSH.on) await disablePush(); store.set("kp_sync_base", {}); toast(ui("delete_done")); } catch (e) { toast(friendly(e)); }
  }
});
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => {
  const d = b.closest("dialog"); d.close();
  if (d.id === "dlg-settings" && settingsDirty && !$("quiz").hidden && phase === "ask" && !R.duel) startRound();
  if (d.id === "dlg-settings") settingsDirty = false;
}));

// ------------------------------------------------------------------ Start
function applyStatic() {
  $("dontknow").textContent = ui("dont_know"); $("type-ok").textContent = ui("check"); $("type-choice").textContent = ui("show_choices");
  $("type-in").placeholder = ui("type_hint"); $("ex-continue").textContent = ui("continue_"); $("again").textContent = ui("again");
  $("done-board").textContent = ui("leaderboard"); $("done-home").textContent = ui("home_hint"); $("quit").textContent = ui("finish");
  document.title = ui("web_title");
}
$("hint-btn").onclick = () => { const mx = R.duel ? 0 : (q === Q_WORD || q === Q_LISTEN || isExtra()) ? 1 : 2; if (phase === "ask" && hint < mx) { hint++; render(false); } };
$("dontknow").onclick = () => { if (phase !== "ask") return; if (R.duel) answerDuel(false, null); else answer(false, null, null, -1, null); };
$("quit").onclick = () => { if (R.duel) finishDuel(true); else { R.focus = null; startRound(); } };
$("type-ok").onclick = onType;
$("type-in").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); onType(); } });
$("type-in").addEventListener("input", e => { const t = e.target.value.trim(); $("type-preview").textContent = t && (q === Q_DICT || (SET.kanamode && q === Q_TYPE)) ? toHiragana(t) : ""; });
$("type-choice").onclick = () => { if (phase !== "ask" || q !== Q_TYPE) return; q = Q_READ; opts = shuffle([cur, ...distractors(cur, 3, false)]); render(true); };
$("ex-continue").onclick = () => { if (phase === "explain") { phase = "wait"; advance(); } };
$("ex-speak").onclick = () => speak(speechText());
$("again").onclick = () => startRound();
$("done-board").onclick = openBoard;
$("btn-board").onclick = openBoard;
$("btn-friends").onclick = () => openFriends();
$("bd-friends").onclick = () => { $("dlg-board").close(); openFriends(); };
$("btn-settings").onclick = openSettings;
$("btn-stats").onclick = openStats;
$("bd-me").onclick = () => askName(false);
$("bd-group").onclick = askGroup;
$("bd-refresh").onclick = loadBoard;
$("bd-link").onclick = askLink;
$("bd-tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { tab = Number(b.dataset.tab); renderBoard(); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { submit(); sync(false); } });
if ("speechSynthesis" in window) speechSynthesis.getVoices();

(async () => {
  checkBadges(false);
  applyTheme();
  await loadLang(pickLang());
  applyStatic();
  startRound();
  loadStrokes();
  sync(false);
  // Link aus einer Duell-Einladung: …/quiz/#duel=CODE
  const m = /duel=([A-Za-z0-9]{6})/.exec(location.hash);
  if (m) { history.replaceState(null, "", location.pathname + location.search); openFriends(() => joinDuel(m[1])); }
})();
</script>
</body>
</html>
