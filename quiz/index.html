    });
  }
  $("type").hidden = explain || q !== Q_TYPE;
  $("explain").hidden = !explain;
  $("quiz").classList.toggle("explaining", explain);
  $("dontknow").style.visibility = explain ? "hidden" : "visible";
  if (fresh) anim(big, "pop");
}
function onOption(i, btn) {
  if (phase !== "ask") return;
  if (q === Q_WORD) { answer(wopts[i].t === word.romaji, null, null, i, btn); return; }
  const c = opts[i]; answer(c === cur, c, null, i, btn);
}
function onType() {
  if (phase !== "ask") return;
  const t = $("type-in").value; if (!t.trim()) return;
  const ok = matches(cur, t); answer(ok, ok ? cur : findByRomaji(cur.script, canon(t)), t, -1, null);
  $("type-in").blur();
}
const willFinish = () => !R.retry.length && R.streak >= R.need;
function answer(ok, chosen, typed, idx, btn) {
  const ms = performance.now() - shownAt; phase = "wait";
  let pts, retryItem = cur, wordChosen = null;
  if (q === Q_WORD) {
    const o = idx >= 0 ? wopts[idx] : null;
    chosen = o ? o.alt : null; wordChosen = o ? o.t : null;
    pts = recordWord(word, ok, ms, hint > 0, o ? o.miss : null, chosen); retryItem = o ? o.miss : null;
  } else pts = record(cur, ok, ms, (!ok && chosen) ? chosen.romaji : null, q, hint > 0);
  R.answered++; R.gaps = R.gaps.map(g => g - 1);
  if (ok) {
    R.streak++; R.points += pts;
    if (btn) { btn.classList.add("good"); anim(btn, "pulse"); }
    anim($("big"), "pulse");
    if (SET.speak) speak(word ? word.kana : cur.kana);
    let t = ui("correct") + "  ·  " + (word ? `${word.kana} = ${word.romaji}  ·  ${meaning(word.kana)}` : `${cur.kana} = ${cur.romaji}`);
    if (hint === 0 && ms < 20000) t += "  ·  " + (ms / 1000).toFixed(1).replace(".", lang === "en" ? "." : ",") + " s";
    $("feedback").textContent = t + "  ·  +" + pts;
    $("progress").textContent = progressText();
    setTimeout(advance, willFinish() ? (word ? 900 : 450) : (word ? 1300 : 700));
  } else {
    R.streak = 0;
    if (retryItem) {
      const k = R.retry.indexOf(retryItem), gap = pool().length > 3 ? 1 : 0;
      if (k >= 0) R.gaps[k] = gap; else { R.retry.push(retryItem); R.gaps.push(gap); }
    }
    if (q === Q_WORD) explainWord(retryItem, chosen, wordChosen); else explainChar(chosen, typed);
    phase = "explain"; render(false);
    anim($("big"), "shake"); anim($("explain"), "slide");
    if (navigator.vibrate) navigator.vibrate(60);
    if (SET.speak) speak(word ? word.kana : cur.kana);
  }
}
function setExplain(title, main, chosen, tipT, mn, strokesFor) {
  $("ex-title").textContent = title; $("ex-main").textContent = main; $("ex-main").classList.toggle("long", main.length > 12);
  $("ex-chosen").textContent = chosen; $("ex-chosen").hidden = !chosen;
  $("ex-tip").textContent = tipT; $("ex-mn").textContent = mn; $("ex-mn").hidden = !mn;
  showStrokes(strokesFor);
}
function explainChar(chosen, typed) {
  const it = cur, dk = !chosen && !(typed && typed.trim());
  let ch = "";
  if (chosen) ch = ui("explain_your_answer", chosen.kana, chosen.romaji); else if (!dk) ch = ui("explain_your_input", typed.trim());
  let t = tip(it, chosen);
  if (!t) {
    const conf = Object.entries(st(it).cf).sort((a, b) => b[1] - a[1])[0], c = conf && findByRomaji(it.script, conf[0]);
    if (c && conf[1] >= 2) { const t2 = tip(it, c); t = ui("explain_often_confused", it.kana, c.kana, c.romaji) + (t2 ? " " + t2 : ""); }
  }
  if (!t) for (const s of similar(it)) { const t3 = tip(it, s); if (t3) { t = ui("explain_dont_confuse", s.kana, s.romaji) + " " + t3; break; } }
  if (!t) t = ui("label_row") + " " + rowString(it);
  const mn = fullMnemonic(it);
  setExplain(ui(dk ? "explain_dontknow" : "explain_wrong"), `${it.kana}  =  ${it.romaji}`, ch, t, mn ? ui("label_mnemonic") + " " + mn : "", it);
}
function explainWord(missed, alt, chosenLabel) {
  const w = word; let t = "";
  const m = meaning(w.kana); if (m) t += ui("label_meaning") + m + "\n";
  t += w.chars.map(c => c.kana + " " + c.romaji).join("  ·  ");
  if (missed && alt) { const tt = tip(missed, alt); t += `\n\n${missed.kana} (${missed.romaji})  ·  ` + ui("explain_dont_confuse", alt.kana, alt.romaji) + (tt ? " " + tt : ""); }
  const mn = missed ? fullMnemonic(missed) : null;
  setExplain(ui(chosenLabel ? "explain_wrong" : "explain_dontknow"), `${w.kana}  =  ${w.romaji}`,
    chosenLabel ? ui("explain_your_reading", chosenLabel) : "", t, mn ? ui("label_mnemonic") + " " + missed.kana + "  " + mn : "", missed);
}
function advance() {
  clearTimeout(strokeTimer);
  if (willFinish()) finishRound(); else next();
}
function finishRound() {
  $("quiz").hidden = true; $("done").hidden = false;
  const stamp = document.querySelector(".stamp"); anim(stamp, "stamp");
  $("done-title").textContent = ui("round_done");
  $("done-points").textContent = ui("round_points", R.points);
  const p = pool(), known = p.filter(it => (S.items[it.kana] || { l: 0 }).l >= 4).length, sd = streakDays();
  rollDay();
  $("done-stats").textContent = ui("summary_known", known, p.length) + "\n" + ui("summary_today", S.dc, S.dw) + (sd > 1 ? "  ·  🔥 " + ui("streak_days", sd) : "");
  $("done-stats").style.whiteSpace = "pre-line";
  $("progress").textContent = "";
  submit();
}

// ------------------------------------------------------------------ Rangliste
const B = Object.assign({ id: null, secret: null, name: "", group: null }, store.get("kp_board", {}));
const saveB = () => store.set("kp_board", B);
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
async function rpc(fn, body) {
  const r = await fetch(CFG.url.replace(/\/+$/, "") + "/rest/v1/rpc/" + fn, {
    method: "POST", headers: { apikey: CFG.key, "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(body)
  });
  const t = await r.text(); if (!r.ok) throw new Error("HTTP " + r.status + ": " + t);
  return t ? JSON.parse(t) : null;
}
async function submit() {
  if (!B.name) return;
  if (!B.id) { B.id = uuid(); B.secret = uuid(); saveB(); }
  const body = { p_id: B.id, p_secret: B.secret, p_name: B.name, p_week: currentWeek(), p_week_points: weekPoints(), p_total_points: S.tp, p_known: knownCount(), p_streak: streakDays() };
  if (B.group !== null) body.p_group = B.group;
  try { await rpc("kana_submit", body); } catch (e) {}
}
function friendly(e) {
  const m = String(e && e.message);
  if (/PGRST202|HTTP 404/.test(m)) return ui("err_setup");
  if (/HTTP 40[13]/.test(m)) return ui("err_key");
  if (e instanceof TypeError) return navigator.onLine === false ? ui("err_offline") : ui("err_conn");
  return ui("err_generic", m);
}
let tab = 0, rows = null;
function openBoard() {
  $("dlg-board").showModal(); updateMe();
  if (!B.name) askName(true); else loadBoard();
}
function updateMe() {
  $("bd-title").textContent = ui("leaderboard");
  const sd = streakDays();
  $("bd-me").textContent = (B.name || ui("set_name")) + "  ✎\n" + ui("me_line", weekPoints(), S.tp, knownCount()) + (sd > 0 ? "  ·  🔥 " + sd : "");
  $("bd-me").style.whiteSpace = "pre-line";
  $("bd-group").textContent = (B.group ? ui("group_label", B.group) : ui("group_none")) + "  ✎";
  $("bd-refresh").textContent = ui("refresh");
  [...$("bd-tabs").children].forEach((b, i) => { b.textContent = ui(["tab_week", "tab_total", "tab_known"][i]); b.classList.toggle("on", i === tab); });
}
async function loadBoard() {
  updateMe(); $("bd-status").textContent = "…"; $("bd-rows").innerHTML = "";
  try {
    await submit();
    const qy = { p_week: currentWeek() }; if (B.group) qy.p_group = B.group;
    const res = await rpc("kana_board", qy), pw = previousWeek();
    rows = (res || []).map(o => ({
      id: o.id, name: o.name || "?", week: o.week_points | 0, total: o.total_points | 0, known: o.known | 0, streak: o.streak | 0, me: o.id === B.id,
      last: o.week === pw ? (o.week_raw | 0) : (o.prev_week === pw ? (o.prev_week_points | 0) : 0)
    }));
    $("bd-status").textContent = rows.length ? "" : ui("board_empty");
    const w = rows.filter(r => r.last > 0).sort((a, b) => b.last - a.last)[0];
    $("bd-winner").hidden = !w; if (w) $("bd-winner").textContent = "🏆  " + ui("winner_line", w.name, w.last) + (w.me ? ui("you") : "");
    renderBoard();
  } catch (e) { $("bd-status").textContent = friendly(e); }
}
function renderBoard() {
  updateMe();
  const box = $("bd-rows"); box.innerHTML = ""; if (!rows) return;
  const val = r => tab === 0 ? r.week : tab === 1 ? r.total : r.known;
  const sorted = [...rows].sort((a, b) => (val(b) - val(a)) || (b.total - a.total));
  const unit = ui(tab === 2 ? "unit_chars" : "unit_pts");
  let rank = 0, prev = null;
  sorted.forEach((r, i) => {
    const v = val(r); if (v !== prev) rank = i + 1; prev = v;
    const row = document.createElement("div"); row.className = "rowx" + (r.me ? " me" : ""); row.style.animationDelay = Math.min(i, 15) * 35 + "ms";
    const rk = document.createElement("span"); rk.className = "rk"; rk.textContent = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : rank + ".";
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = r.name + (r.me ? ui("you") : "") + (r.streak > 1 ? "   🔥" + r.streak : "");
    const vl = document.createElement("span"); vl.className = "val"; vl.textContent = v + unit;
    row.append(rk, nm, vl); box.appendChild(row);
  });
}
function ask({ title, msg, value, hint, max, ok, alt, onOk, onAlt, onCancel }) {
  const d = $("dlg-input");
  $("in-title").textContent = title; $("in-msg").textContent = msg || ""; $("in-msg").hidden = !msg;
  const inp = $("in-text"); inp.value = value || ""; inp.placeholder = hint || ""; inp.maxLength = max || 24;
  $("in-ok").textContent = ok || ui("ok"); $("in-cancel").textContent = ui("cancel");
  $("in-alt").hidden = !alt; $("in-alt").textContent = alt || "";
  $("in-ok").onclick = () => { if (onOk(inp.value) !== false) d.close(); };
  $("in-alt").onclick = () => { d.close(); onAlt && onAlt(); };
  $("in-cancel").onclick = () => { d.close(); onCancel && onCancel(); };
  d.showModal(); setTimeout(() => inp.focus(), 50);
}
function askName(first) {
  ask({
    title: ui(first ? "name_first" : "name_change"), value: B.name, hint: ui("your_name"), max: 24,
    onOk: v => { const n = v.trim().replace(/\s+/g, " ").slice(0, 24); if (!n) { $("in-text").placeholder = ui("name_error"); return false; } B.name = n; saveB(); loadBoard(); },
    onCancel: () => { if (first) $("dlg-board").close(); }
  });
}
function askGroup() {
  ask({
    title: ui("group_title"), msg: ui("group_msg"), value: B.group || "", hint: ui("group_hint"), max: 20, alt: ui("group_all"),
    onOk: v => { B.group = v.trim().toLowerCase().replace(/[^a-z0-9äöüß_-]/g, "").slice(0, 20); saveB(); loadBoard(); },
    onAlt: () => { B.group = ""; saveB(); loadBoard(); }
  });
}

// ------------------------------------------------------------------ Einstellungen
function openSettings() {
  $("st-title").textContent = ui("settings"); $("st-chars").textContent = ui("sec_characters"); $("st-learn").textContent = ui("sec_learning");
  document.querySelectorAll("[data-set]").forEach(c => { c.checked = !!SET[c.dataset.set]; });
  $("st-per").value = String(SET.per); $("st-lang").value = lang;
  $("dlg-settings").showModal();
}
let settingsDirty = false;
document.querySelectorAll("[data-set]").forEach(c => c.addEventListener("change", () => {
  const k = c.dataset.set; settingsDirty = true;
  if ((k === "hira" || k === "kata") && !c.checked && !SET[k === "hira" ? "kata" : "hira"]) { c.checked = true; return; }
  SET[k] = c.checked; store.set("kp_settings", SET);
  if (k === "speak" && c.checked) speak("かな");
}));
$("st-per").addEventListener("change", e => { settingsDirty = true; SET.per = Number(e.target.value); store.set("kp_settings", SET); });
$("st-lang").addEventListener("change", async e => { store.set("kp_lang", e.target.value); await loadLang(e.target.value); applyStatic(); openSettings(); if (phase !== "explain") render(false); });
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => {
  const d = b.closest("dialog"); d.close();
  if (d.id === "dlg-settings" && settingsDirty && !$("quiz").hidden && phase === "ask") startRound();
  if (d.id === "dlg-settings") settingsDirty = false;
}));

// ------------------------------------------------------------------ Start
function applyStatic() {
  $("dontknow").textContent = ui("dont_know"); $("type-ok").textContent = ui("check"); $("type-choice").textContent = ui("show_choices");
  $("type-in").placeholder = ui("type_hint"); $("ex-continue").textContent = ui("continue_"); $("again").textContent = ui("again");
  $("done-board").textContent = ui("leaderboard"); $("done-home").textContent = ui("home_hint");
  document.title = ui("web_title");
}
$("hint-btn").onclick = () => { if (phase === "ask" && hint < (q === Q_WORD ? 1 : 2)) { hint++; render(false); } };
$("dontknow").onclick = () => { if (phase === "ask") answer(false, null, null, -1, null); };
$("type-ok").onclick = onType;
$("type-in").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); onType(); } });
$("type-choice").onclick = () => { if (phase !== "ask" || q !== Q_TYPE) return; q = Q_READ; opts = shuffle([cur, ...distractors(cur, 3)]); render(true); };
$("ex-continue").onclick = () => { if (phase === "explain") { phase = "wait"; advance(); } };
$("ex-speak").onclick = () => speak(word ? word.kana : cur.kana);
$("again").onclick = startRound;
$("done-board").onclick = openBoard;
$("btn-board").onclick = openBoard;
$("btn-settings").onclick = openSettings;
$("bd-me").onclick = () => askName(false);
$("bd-group").onclick = askGroup;
$("bd-refresh").onclick = loadBoard;
$("bd-tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { tab = Number(b.dataset.tab); renderBoard(); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") submit(); });
if ("speechSynthesis" in window) speechSynthesis.getVoices();

(async () => {
  await loadLang(pickLang());
  applyStatic();
  startRound();
})();
</script>
