/* Schulheft: Karopapier, rote Randlinie, Tinte, Füller-Blau, Rotstift, Textmarker */

/* Ende einer Runde */
.done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }

.done h2 { margin: 18px 0 0; font-size: 22px; }

.pop { animation: pop .24s ease-out both; }

.kd-head { display: flex; align-items: center; gap: 18px; margin-top: 4px; }

.kd-chip.cur { border-color: var(--red); background: color-mix(in srgb, var(--red) 14%, var(--card)); }
.rm-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.rm-row b { width: 30px; flex: none; }
.rm-row .goalbar { flex: 1; min-width: 0; }
.rm-row span { width: 46px; flex: none; text-align: right; font-size: 14px; }
.rm-skills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.rm-skill { background: var(--card); border: 1.2px solid var(--rule); border-radius: 12px; padding: 8px 12px 10px; min-width: 0; }
.rm-skill b { display: block; font-size: 14px; overflow-wrap: anywhere; }
.rm-skill .tiny { margin: 4px 0 0; overflow-wrap: anywhere; }
.rm-unit { border-radius: 14px; padding: 10px 16px 12px; color: #fff; margin: 18px 0 6px; }

.rm-unit div { font-size: 14px; opacity: .9; }
.rm-node { display: block; position: relative; border: none; background: none; width: 100%; padding: 8px 0 6px; cursor: pointer; color: var(--ink); }
.rm-node .ring { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; transform: translateX(calc(var(--off) * (min(100vw, 560px) / 2 - 110px)));
  background: conic-gradient(var(--c) calc(var(--p) * 1turn), color-mix(in srgb, var(--muted) 25%, transparent) 0); }
.rm-node .dot { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1.5px solid var(--rule); font-family: var(--hand); font-weight: 600; font-size: 28px; line-height: 1; }
.rm-node.done .dot { background: var(--c); color: #fff; border-color: var(--c); }
.rm-node.cur .ring { width: 90px; height: 90px; }
.rm-node.cur .dot { width: 74px; height: 74px; border: 3px solid var(--c); font-size: 33px; }
.rm-node.future .dot { color: var(--muted); background: color-mix(in srgb, var(--muted) 15%, transparent); }
.rm-node .lbl { display: block; width: max-content; max-width: 180px; margin: 6px auto 0; font-weight: 700; font-size: 13px; transform: translateX(calc(var(--off) * (min(100vw, 560px) / 2 - 110px))); }
.rm-node .st { display: block; width: max-content; max-width: 180px; margin: 0 auto; font-size: 11.5px; color: var(--muted); transform: translateX(calc(var(--off) * (min(100vw, 560px) / 2 - 110px))); }
.rm-node .here { display: inline-block; background: var(--c); color: #fff; font-weight: 700; font-size: 12px; border-radius: 10px; padding: 3px 10px; margin-bottom: 6px; transform: translateX(calc(var(--off) * (min(100vw, 560px) / 2 - 110px))); }
.nd-gram { margin-top: 10px; max-height: 240px; overflow: auto; font-size: 14px; line-height: 1.5; }

.nd-chips button.m4 { background: color-mix(in srgb, var(--green) 55%, transparent); }
.kd-word { padding: 6px 0; cursor: pointer; font-size: 17px; overflow-wrap: anywhere; }

.kd-sent { background: var(--card); border: 1.2px solid var(--rule); border-radius: 10px; padding: 8px 14px 10px; margin-top: 8px; cursor: pointer; }

.hard .hl { cursor: pointer; text-decoration: underline dotted; }
.sx-nav { display: flex; align-items: center; gap: 8px; margin-top: 6px; }

.sx-nav button { min-width: 52px; min-height: 42px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.tile { background: var(--card); border: 1.2px solid var(--rule); border-radius: 10px; padding: 8px 12px 10px; }
.tile b { display: block; font-family: var(--hand); font-weight: 600; font-size: 26px; }
.tile span { font-size: 13px; color: var(--muted); }
.kbar { height: 8px; background: var(--rule); border-radius: 4px; overflow: hidden; margin: 3px 0 8px; }
.kbar i { display: block; height: 100%; background: var(--blue); }
.vbars { display: grid; gap: 2px; align-items: end; height: 100px; margin-top: 8px; }
.vbars i { display: block; background: color-mix(in srgb, var(--blue) 55%, transparent); border-radius: 2px 2px 0 0; min-height: 0; }

dialog#dlg-wrapped::backdrop { background: #000; }
.wr { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top)) 22px max(14px, env(safe-area-inset-bottom)); box-sizing: border-box; cursor: pointer; user-select: none; transition: background .3s; }

.ty-ro { font-weight: 700; font-size: 22px; margin-top: 6px; overflow-wrap: anywhere; }
.ty-buf { font-family: var(--hand); font-weight: 600; font-size: 30px; min-height: 56px; padding: 6px 14px; margin-top: 14px; border: 1.5px solid var(--ink); border-radius: 10px; background: var(--card); overflow-wrap: anywhere; }

.kb2 { grid-template-columns: 1.4fr 1.4fr 1.4fr 1.2fr 0.9fr 1.1fr; margin-top: 3px; }
.kb2 button.w { font-family: var(--body); font-size: 14px; font-weight: 400; }
.ty-flow.kana .ty-cell .y { font-family: var(--hand); font-size: 15px; }
.rowx .rk.up { color: var(--green); }
.rowx .rk.down { color: var(--red); }
.opt.particle { font-family: var(--hand); font-weight: 600; font-size: 34px; }
.opt.small { font-size: 17px; }
.opt.bad { background: var(--red); color: #fff; }
.av {
  flex: none; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--ink); overflow: hidden;
  font-family: var(--hand); font-weight: 600; color: #fff; background: var(--blue); background-size: cover; background-position: center;
}
.av.dark-text { color: #1D2230; }
.rowx .av { width: 32px; height: 32px; font-size: 15px; }
.prow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--rule); }
.prow.me { background: var(--marker); color: var(--on-marker); border: 0; border-left: 5px solid var(--ink); }
.prow .av { width: 44px; height: 44px; font-size: 20px; }
.prow .who { flex: 1; min-width: 0; }
.prow .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .who small { display: block; color: var(--muted); font-size: 13px; white-space: pre-line; }
.prow .pts { font-family: var(--hand); font-weight: 600; color: var(--blue); white-space: nowrap; }
.prow button { min-height: 40px; padding: 0 14px; }
.plist { display: grid; gap: 8px; margin-top: 10px; }
.profile { display: flex; gap: 14px; align-items: center; }

.fcode { font: 700 26px/1.3 ui-monospace, Menlo, monospace; letter-spacing: .08em; color: var(--blue); user-select: all; }
.btnrow { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.btnrow > * { flex: 1; }
.swatches { display: flex; gap: 6px; margin-top: 6px; }
.swatches button { flex: 1; height: 30px; border-radius: 15px; border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent); }

.challenge { background: var(--card); border: 1.5px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--shadow); padding: 12px 16px; margin-top: 12px; }

/* 3.7: Vorschau, Kalender, Live-Duell */
.fc { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 118px; margin-top: 8px; border-bottom: 1.5px solid var(--ink); }
.fc div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 12px; font-weight: 700; }
.fc div i { display: block; width: 62%; background: var(--blue); opacity: .7; border-radius: 3px 3px 0 0; margin-top: 3px; }
.fc div.today { color: var(--red); }
.fc div.today i { background: var(--red); opacity: 1; }
.fc div.zero { color: var(--muted); }
.fcd { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 11px; color: var(--muted); text-align: center; margin-top: 3px; }
.fcd span:first-child { color: var(--red); font-weight: 700; }
.cal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); grid-auto-columns: 1fr; gap: 3px; margin-top: 10px; max-width: 420px; }
.cal i { display: block; aspect-ratio: 1; border-radius: 3px; border: 1px solid color-mix(in srgb, var(--muted) 35%, transparent); }
.cal i.on { border-color: transparent; background: var(--green); }
.cal i.today { outline: 1.5px solid var(--red); outline-offset: 0; }
.cal i.pad { visibility: hidden; }
.live { color: var(--red); font-weight: 700; font-size: 14px; text-align: right; margin-top: 6px; }
.countdown { font-family: var(--hand); color: var(--red); font-size: 120px; line-height: 1; }
</style>

<body>
<div class="app" id="app">
  <div class="top">
    <span class="brand" id="brand">かな</span>
    <span class="progress" id="progress"></span>
    <button class="icon-btn" id="btn-road" aria-label="Path">🗺️</button>
    <button class="icon-btn" id="btn-stats" aria-label="Progress">📊</button>
    <button class="icon-btn" id="btn-friends" aria-label="Friends">👥</button>
    <button class="icon-btn" id="btn-board" aria-label="Leaderboard">🏆</button>
    <button class="icon-btn" id="btn-settings" aria-label="Settings">⚙︎</button>
  </div>
  <div class="live" id="live" hidden></div>
  <div class="notice" id="notice" hidden></div>

  <div id="quiz" style="display:flex;flex-direction:column;flex:1">
    <div class="spacer"></div>
    <div class="center"><span class="badge" id="badge"></span></div>
    <div class="prompt center" id="prompt"></div>
    <div class="center"><p class="big" id="big" lang="ja"></p></div>
    <div class="script center" id="script"></div>
    <div class="center"><button class="hint-btn" id="hint-btn"></button></div>
    <div class="hint" id="hint" hidden></div>
    <div class="feedback" id="feedback"></div>
    <div class="spacer"></div>
    <div class="options" id="options"></div>
    <div class="recall" id="recall" hidden>
      <button class="btn-primary" id="rc-show"></button>
      <div class="row" id="rc-rate"><button class="card-btn" id="rc-again"></button><button class="btn-primary" id="rc-knew"></button></div>
    </div>
    <div id="type" hidden>
      <div class="typerow">
        <input id="type-in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
        <button class="btn-primary" id="type-ok"></button>
      </div>
      <div class="preview" id="type-preview" lang="ja"></div>
      <button class="link-btn" id="type-choice"></button>
    </div>
    <div class="explain" id="explain" hidden>
      <div class="explain-head">
        <div>
          <div class="ex-title" id="ex-title"></div>
          <div class="ex-main" id="ex-main" lang="ja"></div>
          <div class="ex-chosen" id="ex-chosen"></div>
        </div>
        <svg class="strokes" id="ex-strokes" viewBox="0 0 109 109" hidden></svg>
      </div>
      <div class="ex-tip" id="ex-tip"></div>
      <div class="ex-mn" id="ex-mn"></div>
      <div class="ex-actions">
        <button class="card-btn speak" id="ex-speak" aria-label="Play">🔊</button>
        <button class="btn-primary" id="ex-continue"></button>
      </div>
    </div>
    <div class="foot"><button id="dontknow"></button><button id="quit" hidden></button></div>
  </div>

  <div class="done" id="done" hidden>
    <div class="stamp" lang="ja">よくできました</div>
    <h2 id="done-title"></h2>
    <p id="done-points"></p>
    <div class="goalbar" id="done-goalbar"><i></i></div>
    <p id="done-stats"></p>
    <div class="code" id="done-code" hidden></div>
    <div class="row">
      <button class="btn-primary" id="again"></button>
      <button class="card-btn" id="done-share" hidden></button>
      <button class="card-btn" id="done-board"></button>
    </div>
    <p class="tiny" id="done-home"></p>
  </div>
</div>

<dialog id="dlg-settings">
  <div class="sheet">
    <div class="sheet-head"><h2 id="st-title"></h2><button class="icon-btn" data-close>✕</button></div>
    <div class="sec"><b>1</b><span data-ui="h_chars"></span></div>
    <label class="chk"><input type="checkbox" data-set="hira"> Hiragana あ</label>
    <label class="chk"><input type="checkbox" data-set="kata"> Katakana ア</label>
    <label class="chk"><input type="checkbox" data-set="daku"> Dakuten が ぱ</label>
    <label class="chk"><input type="checkbox" data-set="yoon"> Yōon きゃ</label>
    <label class="chk"><input type="checkbox" data-set="kanji"> <span data-ui="kanji_setting"></span> 山 日</label>

function dueForecast(n) {
  const out = new Array(n).fill(0), ends = [];
  for (let i = 1; i <= n; i++) { const t = new Date(); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() + i); ends.push(t.getTime()); }
  const list = pool().map(it => S.items[it.kana]).filter(s => s && s.s);
  for (const [k, s] of Object.entries(S.cards)) if (s.s && (k.startsWith("v:") ? SET.vocab : k.startsWith("n:") ? SET.numbers : k.startsWith("g") ? SET.grammar : k.startsWith("p:") ? SET.phrases : false)) list.push(s);
  for (const s of list) for (let i = 0; i < n; i++) if ((s.d || 0) < ends[i]) { out[i]++; break; }
  return out;
}

  const again = document.createElement("button"); again.className = passed ? "card-btn" : "btn-primary"; again.style.width = "100%"; again.style.marginTop = "14px"; again.textContent = ui("exam_retry"); again.onclick = () => openExam(EX.id);
  const done = document.createElement("button"); done.className = passed ? "btn-primary" : "card-btn"; done.style.width = "100%"; done.style.marginTop = "10px"; done.textContent = ui("exam_done");
  done.onclick = () => { $("dlg-exam").close(); openStats(); };
  b.append(again, done);
  showNotices();
  $("dlg-exam").querySelector(".sheet").scrollTop = 0;
}
$("ex-close").onclick = () => { if (EX.running && !confirm(ui("exam_abort"))) return; EX.running = false; $("dlg-exam").close(); };

// ------------------------------------------------------------------ Einstufungstest (wie PlacementActivity.java)
const PL = { script: 0, row: 0, items: [], pos: 0, ok: true, fails: 0, passed: [[], []], rows: [0, 0], busy: false };
const plRows = sc => { const out = []; for (let r = 0; r < 11; r++) { const row = []; for (let c = 0; c < 5; c++) { const x = at(sc === 0 ? HIRA : KATA, BASE, r, c); if (x) row.push(x); } if (row.length) out.push(row); } return out; };
function openPlace() {
  document.querySelectorAll("dialog[open]").forEach(d => d.close());
  Object.assign(PL, { script: 0, row: 0, fails: 0, passed: [[], []], rows: [0, 0] });
  const b = $("pl-body"); b.innerHTML = "";
  const p1 = document.createElement("p"); p1.textContent = ui("place_intro"); b.appendChild(p1);
  const st = document.createElement("button"); st.className = "btn-primary"; st.style.width = "100%"; st.textContent = ui("place_start"); st.onclick = plRow; b.appendChild(st);
  $("dlg-place").showModal();
}
function plRow() {
  const rs = plRows(PL.script);
  if (PL.row >= rs.length || PL.fails >= 2) {
    if (PL.script === 0 && PL.rows[0] > 0) { PL.script = 1; PL.row = 0; PL.fails = 0; plRow(); } else plResult();
    return;
  }
  PL.items = shuffle([...rs[PL.row]]).slice(0, 3); PL.pos = 0; PL.ok = true; plAsk();
}
function plAsk() {
  PL.busy = false;
  const it = PL.items[PL.pos], b = $("pl-body"); b.innerHTML = "";
  const pr = document.createElement("b"); pr.style.color = "var(--blue)"; pr.textContent = ui("place_progress", PL.script === 0 ? "Hiragana" : "Katakana", PL.row + 1, plRows(PL.script).length); b.appendChild(pr);
  const big = document.createElement("div"); big.className = "pl-big"; big.lang = "ja"; big.textContent = it.kana; b.appendChild(big);
  const opts = [it];
  for (const o of shuffle(plRows(PL.script).flat())) { if (opts.length >= 4) break; if (!opts.some(x => x.romaji === o.romaji)) opts.push(o); }
  const grid = document.createElement("div"); grid.className = "pl-opts";
  shuffle(opts).forEach(o => { const bt = document.createElement("button"); bt.className = "opt"; bt.textContent = o.romaji; bt.onclick = () => plAnswer(o === it, bt); grid.appendChild(bt); });
  b.appendChild(grid);
  const dk = document.createElement("button"); dk.className = "link-btn"; dk.textContent = ui("dont_know"); dk.onclick = () => plAnswer(false, null); b.appendChild(dk);
}
function plAnswer(ok, bt) {
  if (PL.busy) return; PL.busy = true;
  if (bt) bt.classList.add(ok ? "good" : "bad");
  if (!ok) PL.ok = false;
  setTimeout(() => {
    PL.pos++;
    if (!PL.ok || PL.pos >= PL.items.length) {
      if (PL.ok) { PL.passed[PL.script].push(...plRows(PL.script)[PL.row]); PL.rows[PL.script]++; PL.fails = 0; } else PL.fails++;
      PL.row++; plRow();
    } else plAsk();
  }, ok ? 250 : 600);
}
function plResult() {
  const b = $("pl-body"); b.innerHTML = "";
  const total = PL.rows[0] + PL.rows[1], n0 = plRows(0).length, n1 = plRows(1).length;
  const p1 = document.createElement("p"); p1.style.whiteSpace = "pre-line";
  p1.textContent = ui("place_result_line", "Hiragana", PL.rows[0], n0) + (PL.rows[0] > 0 ? "\n" + ui("place_result_line", "Katakana", PL.rows[1], n1) : "") + (total ? "" : "\n\n" + ui("place_none"));
  b.appendChild(p1);
  const ok = document.createElement("button"); ok.className = "btn-primary"; ok.style.width = "100%"; ok.textContent = ui(total ? "place_apply" : "continue_");
  ok.onclick = () => {
    if (total) {
      const now = Date.now();
      for (const it of [...PL.passed[0], ...PL.passed[1]]) {
        const s = st(it); if (s.l >= WORD_LEVEL) continue;
        s.l = WORD_LEVEL; s.s = Math.max(1, s.s); s.c = Math.max(1, s.c); s.i = true; if (!(s.fs > 0)) { s.fs = 3; s.fd = initD(3); }
        s.ls = now; s.d = now + (1 + Math.floor(Math.random() * 3)) * DAY * (0.9 + 0.2 * Math.random());
      }
      if (PL.passed[1].length || PL.rows[0] === n0) { SET.kata = true; store.set("kp_settings", SET); }
      checkBadges(false); save();
    }
    $("dlg-place").close(); startRound();
  };
  b.appendChild(ok);
}
$("sx-place").onclick = openPlace;
$("sx-ev-gr").onclick = () => startDeck(DECK_GRAMMAR);
$("sx-ev-read").onclick = () => openRead();
$("sx-typing").onclick = () => openTyping();

// ------------------------------------------------------------------ Einstellungen und Design
function applyTheme() {
  const t = store.get("kp_theme_v", "system");
  if (t === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  try { localStorage.setItem("kp_theme", t); } catch (e) {}
  document.querySelectorAll("#st-theme button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
}
let settingsDirty = false;
function kanjiBoxes() { ["kanji2", "kanji3", "kanji4", "kanji5"].forEach((k, i) => { document.querySelector(`[data-set="${k}"]`).disabled = kStage() < i + 1; }); }
$("st-jlpt").addEventListener("change", e => { settingsDirty = true; SET.jlpt = Number(e.target.value); store.set("kp_settings", SET); });
function openSettings() {
  $("st-title").textContent = ui("settings");
  document.querySelectorAll("[data-set]").forEach(c => { c.checked = !!SET[c.dataset.set]; });
  kanjiBoxes();
  $("st-jlpt").innerHTML = [0, 5, 4, 3, 2].map(v => `<option value="${v}">${v === 0 ? ui("jlpt_off") : v === 5 ? "N5" : ui("jlpt_upto", "N" + v)}</option>`).join(""); $("st-jlpt").value = String(SET.jlpt || 0);
  $("st-per").value = String(SET.per); $("st-lang").value = lang;
  const g = $("st-goal"); g.innerHTML = [0, 10, 20, 30, 50, 100].map((v, i) => `<option value="${v}">${arr("goal_labels")[i] || v}</option>`).join(""); g.value = String(SET.goal);
  const h = $("st-push-hour"); h.innerHTML = Array.from({ length: 24 }, (_, i) => `<option value="${i}">${String(i).padStart(2, "0")}:00</option>`).join(""); h.value = String(PUSH.hour);
  $("st-everyday").textContent = ui("everyday_info", HIRA_NEEDED);
  $("st-push").checked = !!PUSH.on && pushSupported() && Notification.permission === "granted";
  pushNote();
  applyTheme();
  $("dlg-settings").showModal();
}
document.querySelectorAll("[data-set]").forEach(c => c.addEventListener("change", () => {
  const k = c.dataset.set; settingsDirty = true;
  if ((k === "hira" || k === "kata") && !c.checked && !SET[k === "hira" ? "kata" : "hira"]) { c.checked = true; return; }
  SET[k] = c.checked; store.set("kp_settings", SET);
  if (k.startsWith("kanji")) kanjiBoxes();
  if ((k === "speak" || k === "listen" || k === "dictation") && c.checked) speak("かな");
}));
$("st-per").addEventListener("change", e => { settingsDirty = true; SET.per = Number(e.target.value); store.set("kp_settings", SET); });
$("st-goal").addEventListener("change", e => { SET.goal = Number(e.target.value); store.set("kp_settings", SET); });
$("st-theme").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; store.set("kp_theme_v", b.dataset.t); applyTheme(); });
$("st-lang").addEventListener("change", async e => { store.set("kp_lang", e.target.value); await loadLang(e.target.value); applyStatic(); openSettings(); if (phase !== "explain") render(false); });
$("st-delete").onclick = () => ask({
  title: ui("delete_account"), msg: ui("delete_account_msg"), noInput: true, ok: ui("delete"),
  onOk: async () => {
    if (!B.id) return;
    try { await rpc("kana_delete_me", auth()); if (PUSH.on) await disablePush(); store.set("kp_sync_base", {}); toast(ui("delete_done")); } catch (e) { toast(friendly(e)); }
  }
});
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => {
  const d = b.closest("dialog"); d.close();
  if (d.id === "dlg-settings" && settingsDirty && !$("quiz").hidden && phase === "ask" && !R.duel) startRound();
  if (d.id === "dlg-settings") settingsDirty = false;
}));

// ------------------------------------------------------------------ Start
function applyStatic() {
  $("dontknow").textContent = ui("dont_know"); $("type-ok").textContent = ui("check"); $("type-choice").textContent = ui("show_choices");
  $("type-in").placeholder = ui("type_hint"); $("ex-continue").textContent = ui("continue_"); $("again").textContent = ui("again");
  $("done-board").textContent = ui("leaderboard"); $("done-home").textContent = ui("home_hint"); $("quit").textContent = ui("finish");
  $("rc-show").textContent = ui("recall_show"); $("rc-again").textContent = ui("recall_again"); $("rc-knew").textContent = ui("recall_knew");
  document.title = ui("web_title");
}
function maxHintFor() { return R.duel || q === Q_TYPING ? 0 : q === Q_CARD ? (card && card.hint ? 1 : 0) : (q === Q_WORD || q === Q_LISTEN || isExtra()) ? 1 : 2; }
$("hint-btn").onclick = () => { if (phase === "ask" && hint < maxHintFor()) { hint++; render(false); } };
$("rc-show").onclick = recallShow;
$("rc-again").onclick = () => recallRate(false);
$("rc-knew").onclick = () => recallRate(true);
$("dontknow").onclick = () => { if (phase !== "ask") return; if (R.duel) answerDuel(false, null); else answer(false, null, null, -1, null); };
$("quit").onclick = () => { if (R.duel) finishDuel(true); else { R.focus = null; R.deck = -1; R.ids = null; startRound(); } };
$("type-ok").onclick = onType;
$("type-in").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); onType(); } });
$("type-in").addEventListener("input", e => { const t = e.target.value.trim(); $("type-preview").textContent = t && (q === Q_DICT || (SET.kanamode && q === Q_TYPE)) ? toHiragana(t) : ""; });
$("type-choice").onclick = () => { if (phase !== "ask" || q !== Q_TYPE) return; q = Q_READ; opts = shuffle([cur, ...distractors(cur, 3, false)]); render(true); };
$("ex-continue").onclick = () => { if (phase === "explain") { phase = "wait"; advance(); } };
$("ex-speak").onclick = () => speak(speechText());
$("again").onclick = () => startRound();
$("done-board").onclick = openBoard;
$("btn-board").onclick = openBoard;
$("btn-friends").onclick = () => openFriends();
$("bd-friends").onclick = () => { $("dlg-board").close(); openFriends(); };
$("btn-settings").onclick = openSettings;
$("btn-stats").onclick = openStats;
$("bd-me").onclick = () => askName(false);
$("bd-group").onclick = askGroup;
$("bd-refresh").onclick = loadBoard;
$("bd-link").onclick = askLink;
$("bd-tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { tab = Number(b.dataset.tab); renderBoard(); if (tab === 3 && !league) loadLeague(); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { submit(); sync(false); } });
if ("speechSynthesis" in window) speechSynthesis.getVoices();

(async () => {
  checkBadges(false);
  applyTheme();
  await Promise.all([loadLang(pickLang()), loadJlpt()]);
  applyStatic();
  recapNotice();
  startRound();
  loadStrokes();
  sync(false);
  // Link aus einer Duell-Einladung: …/quiz/#duel=CODE
  const m = /duel=([A-Za-z0-9]{6})/.exec(location.hash);
  if (m) { history.replaceState(null, "", location.pathname + location.search); openFriends(() => joinDuel(m[1])); }
})();
</script>
